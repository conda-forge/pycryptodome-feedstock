schema_version: 1

context:
  version: "3.24.1"

package:
  name: pycryptodome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycryptodome/pycryptodome-${{ version }}.tar.gz
  sha256: 3f9e74444c0ecbec7af232a95d282c74b114d53212ce075ed17b7fd7dca32bb3

build:
  number: 0
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - pip
    - python
    - setuptools
    - if: not win
      then: gmp
  run:
    - python
    - if: not win
      then: gmp

tests:
  - python:
      imports:
        - Crypto
        - Crypto.Cipher
        - Crypto.Hash
        - Crypto.IO
        - Crypto.Math
        - Crypto.Protocol
        - Crypto.PublicKey
        - Crypto.Random
        - Crypto.SelfTest
        - Crypto.SelfTest.Cipher
        - Crypto.SelfTest.Hash
        - Crypto.SelfTest.IO
        - Crypto.SelfTest.Math
        - Crypto.SelfTest.Protocol
        - Crypto.SelfTest.PublicKey
        - Crypto.SelfTest.Random
        - Crypto.SelfTest.Signature
        - Crypto.SelfTest.Util
        - Crypto.Signature
        - Crypto.Util
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://www.pycryptodome.org
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: Cryptographic library for Python
  documentation: https://www.pycryptodome.org/en/latest/
  repository: https://github.com/Legrandin/pycryptodome

extra:
  recipe-maintainers:
    - mariusvniekerk
    - benhuff
    - nehaljwani
    - wolfv
