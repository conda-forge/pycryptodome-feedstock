schema_version: 1

context:
  version: "4.4.0"

package:
  name: pycryptodome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycryptodome/pycryptodome-${{ version }}.tar.gz
  sha256: eab7620c60c85f3fa251d026ec06e094f036d96187bebb9752e46fbcebabbb55

build:
  number: 1
  skip: match(python, "<3.9")
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - Crypto
        - Crypto.Cipher
        - Crypto.Hash
        - Crypto.IO
        - Crypto.Math
        - Crypto.Protocol
        - Crypto.PublicKey
        - Crypto.PublicKey.MLDSA
        - Crypto.PublicKey.MLKEM
        - Crypto.Random
        - Crypto.SelfTest
        - Crypto.SelfTest.Cipher
        - Crypto.SelfTest.Hash
        - Crypto.SelfTest.IO
        - Crypto.SelfTest.Math
        - Crypto.SelfTest.Protocol
        - Crypto.SelfTest.PublicKey
        - Crypto.SelfTest.Random
        - Crypto.SelfTest.Signature
        - Crypto.SelfTest.Util
        - Crypto.Signature
        - Crypto.Util
  - script: python run_test.py
    files:
      recipe:
        - run_test.py
  - script: python -m Crypto.SelfTest --skip-slow-tests -q
    requirements:
      run:
        - pytest

about:
  homepage: https://www.pycryptodome.org
  license: BSD-2-Clause AND Unlicense AND (Apache-2.0 OR ISC OR MIT)
  license_file:
    - LICENSE.rst
    - src/mldsa-native/LICENSE
    - src/mlkem-native/LICENSE
  summary: Cryptographic library for Python
  documentation: https://www.pycryptodome.org/en/latest/
  repository: https://github.com/Legrandin/pycryptodome

extra:
  recipe-maintainers:
    - mariusvniekerk
    - benhuff
    - nehaljwani
    - wolfv
